<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <!-- Otter sprite sheet: 3 columns x 2 rows. Each cell 300x300.
       Cell order (background-position): idle(0,0) swimming(50%,0) eating(100%,0)
                                        sleeping(0,100%) sleep-towel(50%,100%) working(100%,100%) -->
  <defs>
    <!-- shared otter parts (sitting base) -->
    <g id="otter-parts">
      <ellipse id="body" cx="0" cy="0" rx="52" ry="66" fill="#a67c62"/>
      <circle id="head" cx="0" cy="-42" r="30" fill="#a67c62"/>
      <circle id="ear-l" cx="-14" cy="-60" r="7" fill="#a67c62"/>
      <circle id="ear-r" cx="14" cy="-60" r="7" fill="#a67c62"/>
      <ellipse id="belly" cx="0" cy="6" rx="26" ry="34" fill="#e8dccf"/>
      <ellipse id="muzzle" cx="0" cy="-22" rx="11" ry="7" fill="#e8dccf"/>
      <ellipse id="nose" cx="0" cy="-20" rx="4" ry="3" fill="#4a3a33"/>
      <circle id="eye-l" cx="-9" cy="-28" r="3" fill="#4a3a33"/>
      <circle id="eye-r" cx="9" cy="-28" r="3" fill="#4a3a33"/>
      <ellipse id="paw" cx="0" cy="0" rx="9" ry="11" fill="#a67c62"/>
      <ellipse id="foot" cx="0" cy="0" rx="14" ry="10" fill="#a67c62"/>
      <path id="tail" d="M 22 10 Q 40 20 36 42 Q 30 50 20 42" fill="none" stroke="#8c6a56" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- CELL 1: idle — waving hello (top-left) -->
  <g transform="translate(150, 180)">
    <use href="#body"/>
    <use href="#head"/>
    <use href="#ear-l"/>
    <use href="#ear-r"/>
    <use href="#belly"/>
    <!-- waving right paw -->
    <g transform="translate(38, -12) rotate(-25)">
      <use href="#paw"/>
    </g>
    <!-- left paw down -->
    <g transform="translate(-34, 18) rotate(15)">
      <use href="#paw"/>
    </g>
    <use href="#muzzle"/>
    <use href="#nose"/>
    <use href="#eye-l"/>
    <use href="#eye-r"/>
    <use href="#foot" transform="translate(-24, 42)"/>
    <use href="#foot" transform="translate(20, 42)"/>
    <use href="#tail" transform="translate(30, 30) rotate(20)"/>
  </g>

  <!-- CELL 2: swimming (top-middle) -->
  <g transform="translate(450, 180)">
    <g transform="rotate(-8)">
      <use href="#body" transform="rotate(8)"/>
      <use href="#head" transform="translate(0,0) rotate(8)"/>
      <use href="#ear-l" transform="translate(-14,-60) rotate(8)"/>
      <use href="#ear-r" transform="translate(14,-60) rotate(8)"/>
      <use href="#belly" transform="rotate(8)"/>
      <use href="#muzzle" transform="rotate(8)"/>
      <use href="#nose" transform="rotate(8)"/>
      <use href="#eye-l" transform="rotate(8)"/>
      <use href="#eye-r" transform="rotate(8)"/>
      <!-- front paws paddling -->
      <use href="#paw" transform="translate(34,-14) rotate(8)"/>
      <use href="#paw" transform="translate(34,6) rotate(8)"/>
      <!-- back feet -->
      <use href="#foot" transform="translate(-26,40) rotate(8)"/>
      <use href="#foot" transform="translate(-26,56) rotate(8)"/>
      <use href="#tail" transform="translate(-40,30) rotate(-10)"/>
    </g>
  </g>

  <!-- CELL 3: eating — golden fish (top-right) -->
  <g transform="translate(750, 180)">
    <!-- golden fish held in paws -->
    <g transform="translate(2, -28)">
      <ellipse cx="0" cy="0" rx="20" ry="10" fill="#f2d9a8" stroke="#d9b36a" stroke-width="2"/>
      <ellipse cx="14" cy="-2" rx="8" ry="6" fill="#f2d9a8" stroke="#d9b36a" stroke-width="2"/>
      <circle cx="6" cy="-6" r="2" fill="#4a3a33"/>
    </g>
    <use href="#body"/>
    <use href="#head"/>
    <use href="#ear-l"/>
    <use href="#ear-r"/>
    <use href="#belly"/>
    <!-- paws holding fish -->
    <use href="#paw" transform="translate(26,-20) rotate(-15)"/>
    <use href="#paw" transform="translate(-2,-32) rotate(25)"/>
    <use href="#muzzle"/>
    <use href="#nose"/>
    <use href="#eye-l"/>
    <use href="#eye-r"/>
    <use href="#foot" transform="translate(-22,40)"/>
    <use href="#foot" transform="translate(18,40)"/>
    <use href="#tail" transform="translate(32,30) rotate(25)"/>
  </g>

  <!-- CELL 4: sleeping on pillow (bottom-left) -->
  <g transform="translate(150, 480)">
    <!-- pillow -->
    <rect x="-56" y="-18" width="112" height="46" rx="14" fill="#e8dccf" stroke="#c9b1a0" stroke-width="2"/>
    <use href="#body" transform="rotate(-12)"/>
    <use href="#head" transform="translate(0,-42) rotate(-12)"/>
    <use href="#ear-l" transform="translate(-14,-60) rotate(-12)"/>
    <use href="#ear-r" transform="translate(14,-60) rotate(-12)"/>
    <!-- closed sleeping eyes -->
    <path d="M -9 -30 Q -9 -26 -5 -26 Q -1 -26 -1 -30" fill="none" stroke="#4a3a33" stroke-width="2" stroke-linecap="round"/>
    <path d="M 9 -30 Q 9 -26 5 -26 Q 1 -26 1 -30" fill="none" stroke="#4a3a33" stroke-width="2" stroke-linecap="round"/>
    <use href="#muzzle" transform="rotate(-12)"/>
    <use href="#nose" transform="rotate(-12)"/>
    <use href="#foot" transform="translate(-20,44) rotate(-12)"/>
    <use href="#foot" transform="translate(20,44) rotate(-12)"/>
    <use href="#tail" transform="translate(30,42) rotate(30)"/>
    <circle cx="0" cy="-10" r="2" fill="#d89a9a"/>
  </g>

  <!-- CELL 5: sleeping on towel (bottom-middle) -->
  <g transform="translate(450, 480)">
    <!-- towel -->
    <rect x="-60" y="-26" width="120" height="52" rx="10" fill="#cdeee3" stroke="#9adbc8" stroke-width="2"/>
    <use href="#body" transform="rotate(-8)"/>
    <use href="#head" transform="translate(2,-44) rotate(-8)"/>
    <use href="#ear-l" transform="translate(-14,-62) rotate(-8)"/>
    <use href="#ear-r" transform="translate(14,-62) rotate(-8)"/>
    <path d="M -9 -32 Q -9 -28 -5 -28 Q -1 -28 -1 -32" fill="none" stroke="#4a3a33" stroke-width="2" stroke-linecap="round"/>
    <path d="M 9 -32 Q 9 -28 5 -28 Q 1 -28 1 -32" fill="none" stroke="#4a3a33" stroke-width="2" stroke-linecap="round"/>
    <use href="#muzzle" transform="rotate(-8)"/>
    <use href="#nose" transform="rotate(-8)"/>
    <use href="#foot" transform="translate(-22,46) rotate(-8)"/>
    <use href="#foot" transform="translate(22,46) rotate(-8)"/>
    <use href="#tail" transform="translate(34,44) rotate(28)"/>
  </g>

  <!-- CELL 6: working — glasses + book (bottom-right) -->
  <g transform="translate(750, 480)">
    <!-- book -->
    <rect x="-46" y="-40" width="92" height="56" rx="6" fill="#e8dcf5" stroke="#c8b3e8" stroke-width="2"/>
    <rect x="-44" y="-38" width="14" height="52" rx="3" fill="#c8b3e8"/>
    <use href="#body" transform="rotate(-6)"/>
    <use href="#head" transform="translate(0,-42) rotate(-6)"/>
    <use href="#ear-l" transform="translate(-14,-60) rotate(-6)"/>
    <use href="#ear-r" transform="translate(14,-60) rotate(-6)"/>
    <!-- round glasses -->
    <circle cx="-11" cy="-28" r="7" fill="none" stroke="#4a3a33" stroke-width="2.5"/>
    <circle cx="11" cy="-28" r="7" fill="none" stroke="#4a3a33" stroke-width="2.5"/>
    <line x1="-4" y1="-28" x2="4" y2="-28" stroke="#4a3a33" stroke-width="2"/>
    <use href="#muzzle" transform="rotate(-6)"/>
    <use href="#nose" transform="rotate(-6)"/>
    <!-- peeking eyes over glasses -->
    <circle cx="-11" cy="-24" r="2" fill="#4a3a33"/>
    <circle cx="11" cy="-24" r="2" fill="#4a3a33"/>
    <use href="#foot" transform="translate(-18,42) rotate(-6)"/>
    <use href="#foot" transform="translate(18,42) rotate(-6)"/>
    <use href="#tail" transform="translate(32,40) rotate(22)"/>
  </g>
</svg>
